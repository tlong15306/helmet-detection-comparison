schema_version: demo-thresholds-2.0
note: >-
  Hai checkpoint baseline được giữ nguyên. Faster R-CNN và RetinaNet dùng
  horizontal-flip TTA vì đều vượt baseline trên validation; threshold theo
  lớp cũng được chọn lại trên validation, không dùng test để hiệu chỉnh.
models:
  fasterrcnn_resnet50_fpn_v2:
    confidence_thresholds:
      BikeWithRider: 0.95
      NoHelmet: 0.65
      Helmet: 0.70
    selection_split: val
    selection_target_class: NoHelmet
    selection_metric: f1
    selection_iou_threshold: 0.5
    checkpoint_sha256: 27fc925e68cd908e82b3865f3781ea01ee643c67674a392e62d7893d59f92682
    inference_mode: horizontal_flip_tta
    fusion_iou_threshold: 0.55
    max_detections: 100
